<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0">
        <animate attributeName="stop-color" values="#8A2BE2;#00F2FE;#FF007F;#8A2BE2" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00F2FE;#FF007F;#8A2BE2;#00F2FE" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#FF007F" stop-opacity="1">
        <animate attributeName="stop-color" values="#FF007F;#8A2BE2;#00F2FE;#FF007F" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="75%" stop-color="#00F2FE" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#00F2FE;#FF007F;#8A2BE2;#00F2FE" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0">
        <animate attributeName="stop-color" values="#8A2BE2;#00F2FE;#FF007F;#8A2BE2" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="50" y="10" width="800" height="3" rx="1.5" fill="url(#neonGradient)" filter="url(#neonGlow)"/>
  <circle cx="450" cy="11.5" r="4" fill="#00F2FE" filter="url(#neonGlow)">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#00F2FE;#FF007F;#00F2FE" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
