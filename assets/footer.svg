<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 90" width="100%" height="90">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="footerWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3">
        <animate attributeName="stop-color" values="#00F2FE;#9B51E0;#FF007F;#00F2FE" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#9B51E0" stop-opacity="0.3">
        <animate attributeName="stop-color" values="#9B51E0;#FF007F;#00F2FE;#9B51E0" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#9B51E0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF007F" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="846" height="86" rx="14" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.5"/>

  <path fill="url(#footerWave)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite" values="
      M 0 50 Q 212 25 425 50 T 850 40 L 850 90 L 0 90 Z;
      M 0 40 Q 212 60 425 35 T 850 50 L 850 90 L 0 90 Z;
      M 0 50 Q 212 25 425 50 T 850 40 L 850 90 L 0 90 Z
    "/>
  </path>

  <text x="425" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94A3B8" letter-spacing="1">
    DESIGNED &amp; ENGINEERED BY MAYUR KUMAR SINGH &#8226; LUCKNOW, INDIA
  </text>
</svg>